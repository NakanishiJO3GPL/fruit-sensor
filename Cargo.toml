[package]
name = "stmlcd"
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"     # サイズ最適化
lto = true           # リンク時最適化
codegen-units = 1    # 最適化優先
strip = true         # デバッグシンボル削除

[dependencies]
embassy-stm32 = { version = "0.6", features = ["stm32g431kb", "time-driver-any", "memory-x", "exti"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }

cortex-m = { version = "0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
panic-halt = "1.0"

embedded-hal = "1.0"
embedded-hal-bus = "0.2"

embedded-graphics = "0.8"
display-interface-spi = "0.5"
ili9341 = "0.6"
